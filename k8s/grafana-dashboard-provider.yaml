# Dashboards kept in this repository (k8s/dashboards, made into the grafana-dashboards ConfigMap by
# kustomize): loaded at start into the « Pi » folder, read-only in the UI.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: pi
        folder: Pi
        type: file
        disableDeletion: true
        allowUiUpdates: false
        options:
          path: /etc/grafana/dashboards
